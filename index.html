<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waga - Aplikacja</title>
    <link rel="stylesheet" href="style.css">
    <!-- iOS PWA Fullscreen Settings -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Waga">

<!-- Automatyczna, wektorowa ikona ikona PWA (waga) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23007aff'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' font-size='50'>⚖️</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23007aff'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' font-size='50'>⚖️</text></svg>">
</head>
<body>

    <div class="container">
        <h2>Waga</h2>

        <!-- Przełącznik widoków -->
        <div class="view-switch">
            <button id="showDaily" class="tab-btn active">Codzienne pomiary</button>
            <button id="showWeekly" class="tab-btn">Tygodniowe średnie</button>
        </div>

        <!-- EKRAN 1: CODZIENNY -->
        <div id="dailyView">
            <div class="summary-card">
                <div id="currentWeight">Aktualna waga: -</div>
                <div id="weeklyAvg">Ostatnia średnia z 7 dni: -</div>
                <div id="totalChange">Całkowita zmiana: -</div>
            </div>
            
            <div class="input-group">
                <label for="weightInput">Dzisiejsza waga (kg):</label>
                <input type="number" id="weightInput" step="0.1" placeholder="np. 125.0">
                <button id="saveBtn">Zapisz wagę</button>
                <button id="avgBtn">Oblicz średnią z tygodnia</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Waga</th>
                        <th>Średnia</th>
                        <th>Dzienna zmiana</th>
                        <th>Opcje</th>
                        <th>Zmiana średniej</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>



            <!-- Przycisk zwijania/rozwijania historii -->
            <button id="toggleHistoryBtn" class="toggle-btn hidden">Pokaż starsze wpisy</button>

        <!-- EKRAN 2: TYGODNIOWE ŚREDNIE (ARCHIWUM) -->
        <div id="weeklyView" class="hidden">
            <h3>Archiwum średnich tygodniowych</h3>
            <table>
                <thead>
                    <tr>
                        <th>Data zapisu</th>
                        <th>Średnia waga</th>
                        <th>Zmiana tygodniowa</th>
                        <th>Opcje</th>
                    </tr>
                </thead>
                <tbody id="weeklyTableBody"></tbody>
            </table>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
