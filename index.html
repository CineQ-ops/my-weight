<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waga</title>
    <!-- Podpięcie zewnętrznego pliku CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Waga</h2>

    <!-- Pole do wpisania wagi -->
    <label for="weightInput">Dzisiejsza waga (kg):</label>
    <input type="number" id="weightInput" step="0.1" placeholder="np. 125.0">

    <!-- Przyciski -->
    <button id="saveBtn">Zapisz wagę</button>
    <button id="avgBtn">Oblicz średnią z tygodnia</button>

    <!-- Tabela na wyniki -->
    <table>
        <thead>
            <tr>
                <th>Data</th>
                <th>Waga</th>
                <th>Średnia</th>
                <th>Zmiana</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Tutaj JavaScript będzie dopisywał wiersze -->
        </tbody>
    </table>

    <!-- Podpięcie zewnętrznego pliku JavaScript -->
    <script src="app.js"></script>
</body>
</html>
